# 📄 Deploy GitHub Pages — Technical Article Translator
#
# Faz deploy do frontend estático no GitHub Pages
# a cada push na branch main.

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          exclusion: |
            **/python/**
            **/csharp/**
            **/.github/**

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4